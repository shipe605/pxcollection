<script>
(()=>{let COLORS=[];
let HEX={};
function applyStagePalette(stage){
 activePalette=stage.palette;
 COLORS=activePalette.map((_,i)=>`c${i}`);
 HEX={};
 activePalette.forEach((rgb,i)=>{HEX[`c${i}`]=`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;});
 let style=document.getElementById("stage-palette-style");
 if(!style){style=document.createElement("style");style.id="stage-palette-style";document.head.appendChild(style);}
 style.textContent=COLORS.map((c,i)=>`.cell.${c}{background:${HEX[c]}}`).join("\n");
}
const BOARD_COLS=100, BOARD_ROWS=100, BOARD_SIZE=BOARD_COLS;

// 盤面に残る各色のピクセル数と、ボール＋補充待ちの同色カウント総数を一致させる。
// 各色の総数を10〜70のスタックに分割する。スタック数を無制限に均等選択すると
// 10前後の小さなスタックに偏りやすいため、平均30〜50程度になる個数を基準にする。
let laneQueues=[];
function makeRandomStacks(color,total){
 if(total<=0)return [];
 // 色の総数が10未満なら、総数を一致させるため例外的にそのまま1個にする。
 if(total<10)return [{color,count:total}];
 const minStacks=Math.ceil(total/70), maxStacks=Math.floor(total/10);
 const targetAverage=30+Math.random()*20; // 30〜50を目安に、10〜70の数字を幅広く出す
 let stackCount=Math.round(total/targetAverage);
 stackCount=Math.max(minStacks,Math.min(maxStacks,stackCount));
 const stacks=[];
 let left=total;
 for(let i=0;i<stackCount;i++){
  const remainingStacks=stackCount-i-1;
  const minNow=Math.max(10,left-70*remainingStacks);
  const maxNow=Math.min(70,left-10*remainingStacks);
  const count=minNow+Math.floor(Math.random()*(maxNow-minNow+1));
  stacks.push({color,count});
  left-=count;
 }
 return stacks;
}
function rebuildBallSupply(){
 const stacks=[];
 for(const color of COLORS){
  const total=board.filter(x=>x===color).length;
  stacks.push(...makeRandomStacks(color,total));
 }
 for(let i=stacks.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [stacks[i],stacks[j]]=[stacks[j],stacks[i]];
 }
 // 先に全ボールの順番を決め、5列へ順番に振り分ける。
 laneQueues=Array.from({length:5},()=>[]);
 stacks.forEach((ball,i)=>laneQueues[i%5].push(ball));
}
function randomQueue(){rebuildBallSupply();return laneQueues.map(lane=>lane[0]||null)}

     clearedStages=Math.max(clearedStages,currentStage+1);
     try{localStorage.setItem('pixelCollectionCleared',String(clearedStages));}catch(e){}
     if(currentStage<STAGES.length-1){dialog("ステージクリア！","次のステージへ進もう。","次へ",()=>{currentStage++;try{localStorage.setItem('pixelCollectionStage',String(currentStage));}catch(e){}newGame()});}
     else{dialog("ステージクリア！","現在は進行確認用の仮ステージが最後だ。","もう一度",newGame);}
    }
    break;
   }
   waveNumber++;
   const waveCounts={red:0,orange:0,yellow:0,green:0,blue:0,purple:0};wave.forEach(x=>waveCounts[x.color]++);
   logs.push(`第${waveNumber}波 赤${waveCounts.red}/橙${waveCounts.orange}/黄${waveCounts.yellow}/緑${waveCounts.green}/青${waveCounts.blue}/紫${waveCounts.purple}（計${wave.length}）`);
   // この波の対象を即時予約し、盤面から論理的に取り除く。粒子の到着・残数減算は演出に合わせる。
   for(const item of wave){reservedPixels.add(item.index);scheduledCounts.set(item.ball,(scheduledCounts.get(item.ball)||0)+1);}
   render();
   const waveRecord={done:false,promise:null};
   const animPromise=animateWave(wave,token).then(arrived=>{
    if(token!==runToken)return;
    // 描画負荷対策で省略した粒子分も、波の演出終了時に残数を減らす。
    for(const item of wave){board[item.index]=null;reservedPixels.delete(item.index);if(!arrived.has(item.index)){if(item.ball.count>0)item.ball.count--;const reserved=scheduledCounts.get(item.ball)||0;if(reserved>0)scheduledCounts.set(item.ball,reserved-1);}}
    for(let s=0;s<slots.length;s++)if(slots[s]&&slots[s].count<=0)slots[s]=null;
    render();
   }).finally(()=>{waveRecord.done=true;});
   waveRecord.promise=animPromise;activeWaves.push(waveRecord);
   // 少しだけ間を置いて次の波を始める。前の波の到着を待たず、演出を重ねる。
   await wait(180);
   activeWaves=activeWaves.filter(w=>!w.done);
  }
 }catch(e){
  gameOver=true;dialog("処理を停止しました","処理を続行できませんでした。ステージをやり直してください。","やり直す",newGame);
 }finally{
  if(token===runToken){
   processing=false;
   if(!gameOver){
    render();
    if(slots.every(Boolean)){
     gameOver=true;laneQueues=laneQueues.map(()=>[]);queue=laneQueues.map(()=>null);render();
     dialog("ステージ失敗","4つの待機スロットが埋まった。現在のステージを最初からやり直す。","やり直す",newGame);
    }else if(board.some(Boolean))$("message").textContent="次のボールを選ぼう。回収できないボールはスロットで待機する。";
   }
  }
 }
}
async function animateWave(wave,token){
 const wrap=$("board-wrap").getBoundingClientRect();
 const boardEl=$("board"),cells=[...boardEl.children];
 const layer=document.createElement("div");
 Object.assign(layer.style,{position:"fixed",inset:"0",pointerEvents:"none",zIndex:"5",overflow:"hidden"});
 document.body.appendChild(layer);
 const left=wrap.left-10,right=wrap.right+10,top=wrap.top-10,bottom=wrap.bottom+10;
 const dots=[],arrivedIndices=new Set();
 const center=i=>{const r=cells[i].getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};
 // ピクセルの上下左右のうち、スロットに近く、色付きマスに遮られない方向を選ぶ。
 // 盤面内はその方向へ直線移動。外周は、盤面の外側へ出る方向しか通れない場合に利用する。
 function routeFor(start,tx,ty){
  const r=Math.floor(start/BOARD_COLS),c=start%BOARD_COLS,[sx,sy]=center(start);
  const margin=12;
  const dirs=[
   {name:'up',dr:-1,dc:0,edge:[sx,top],dist:Math.abs(ty-top)},
   {name:'down',dr:1,dc:0,edge:[sx,bottom],dist:Math.abs(ty-bottom)},
   {name:'left',dr:0,dc:-1,edge:[left,sy],dist:Math.abs(tx-left)},
   {name:'right',dr:0,dc:1,edge:[right,sy],dist:Math.abs(tx-right)}
  ];
  const valid=[];
  for(const d of dirs){
   let rr=r+d.dr,cc=c+d.dc,clear=true;
   while(rr>=0&&rr<BOARD_ROWS&&cc>=0&&cc<BOARD_COLS){
    const idx=rr*BOARD_COLS+cc;
    if(!cells[idx].classList.contains("empty")){clear=false;break}
    rr+=d.dr;cc+=d.dc;
   }
   if(clear)valid.push(d);
  }
  valid.sort((a,b)=>a.dist-b.dist);
  const chosen=valid[0];
  const gatherY=bottom+margin; // 該当スロットの真上に集まる位置
  const gather=[tx,gatherY];
  if(!chosen){
   // 安全な退路がない場合も、盤面の外側だけを通ってスロット直上へ向かう。
   const sideX=(sx-left)<(right-sx)?left-margin:right+margin;
   return [[sx,sy],[sideX,sy],[sideX,gatherY],gather,[tx,ty]];
  }
  const ep=chosen.edge;
  // まず選んだ開放辺から盤面外へ出て、盤面の外周だけを通り、
  // 対応スロットの真上に集合してから真下へ落ちる。
  if(chosen.name==='down'){
   return [[sx,sy],ep,[sx,bottom+margin],gather,[tx,ty]];
  }
  if(chosen.name==='up'){
   const sideX=(sx-left)<(right-sx)?left-margin:right+margin;
   return [[sx,sy],ep,[sx,top-margin],[sideX,top-margin],[sideX,gatherY],gather,[tx,ty]];
  }
  if(chosen.name==='left'){
   return [[sx,sy],ep,[left-margin,sy],[left-margin,gatherY],gather,[tx,ty]];
  }
  return [[sx,sy],ep,[right+margin,sy],[right+margin,gatherY],gather,[tx,ty]];
 }
 const items=[];
 const visualWave=wave.length>240?wave.filter((item,i)=>i%Math.ceil(wave.length/240)===0).slice(0,240):wave;
 for(const item of visualWave){
  const slot=$("slots").children[item.slot];if(!cells[item.index]||!slot)continue;
  const b=slot.getBoundingClientRect(),tx=b.left+b.width/2,ty=b.top+b.height/2;
  const pts=routeFor(item.index,tx,ty);
  for(let k=0;k<4;k++){
   const dot=document.createElement("i"),size=3+(k%3);
   Object.assign(dot.style,{position:"fixed",width:size+"px",height:size+"px",background:HEX[item.color],borderRadius:"1px",left:pts[0][0]+"px",top:pts[0][1]+"px",opacity:"1",transform:"translate(-50%,-50%)"});
   layer.appendChild(dot);dots.push({dot,pts,k,index:item.index,slot:item.slot});
  }
 }
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 // 同じスロットに向かう粒子は、スロットに近いピクセルから順に少しずつ崩れる。
 // 1ピクセル内の粒子は同時に発射し、ピクセルごとの発射間隔で砂がさらさら崩れる印象を作る。
 // 粒子の移動速度は一定。距離が長い粒子ほど到着が遅い。
 const speed=520; // px/秒：v0.11に近いゆったりした速度
 const launchGap=14; // ピクセルごとの発射間隔（ms）
 const orderByIndex=new Map();
 const orderedPixels=visualWave.slice().sort((a,b)=>distance(a.index,a.slot)-distance(b.index,b.slot)||a.index-b.index);
 orderedPixels.forEach((item,rank)=>orderByIndex.set(item.index,rank*launchGap));
 const anim=dots.map(d=>{
  const seg=[];let total=0;
  for(let i=1;i<d.pts.length;i++){const a=d.pts[i-1],b=d.pts[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push({a,b,len,start:total});total+=len}
  return {...d,seg,total,delay:orderByIndex.get(d.index)||0,duration:total/speed*1000};
 });
 const maxDuration=Math.max(0,...anim.map(a=>a.delay+a.duration));
 const started=new Set();
 const t0=performance.now();
 await new Promise(resolve=>{
  function frame(now){
   const elapsed=now-t0;
   for(const a of anim){
    if(elapsed<a.delay){continue;}
    if(!started.has(a.index)){
     started.add(a.index);visualCleared.add(a.index);
     const cell=cells[a.index];if(cell){cell.className='cell empty';}
    }
    const localElapsed=elapsed-a.delay;
    let dist=Math.min(a.total,localElapsed/1000*speed),pt=a.pts[0];
    for(const seg of a.seg){if(dist<=seg.start+seg.len){const f=seg.len?Math.max(0,(dist-seg.start)/seg.len):1;pt=[seg.a[0]+(seg.b[0]-seg.a[0])*f,seg.a[1]+(seg.b[1]-seg.a[1])*f];break}pt=seg.b;}
    a.dot.style.left=pt[0]+"px";a.dot.style.top=pt[1]+"px";
    if(localElapsed>=a.duration){
     a.dot.style.opacity="0";a.dot.style.transform="translate(-50%,-50%) scale(.3)";
     if(!arrivedIndices.has(a.index)){
      arrivedIndices.add(a.index);
      const item=visualWave.find(x=>x.index===a.index);
      if(item)decrementAtArrival(item);
     }
    }
   }
   if(elapsed<maxDuration)requestAnimationFrame(frame);else resolve();
  }
  requestAnimationFrame(frame);
 });
 layer.remove();
 for(const item of wave){visualCleared.add(item.index);if(cells[item.index])cells[item.index].className="cell empty";}
 return arrivedIndices;
}
function dialog(t,m,l,cb){$("dialog-title").textContent=t;$("dialog-text").textContent=m;$("dialog-button").textContent=l;$("dialog-button").onclick=()=>{$("overlay").classList.remove("show");cb()};$("overlay").classList.add("show")}
$("shuffleButton").addEventListener("click",shuffleRemainingBalls);
$("reset").addEventListener("click",()=>{if(processing)return;dialog("最初からやり直す？","盤面とボールを初期状態に戻す。","やり直す",newGame)});
$("homeButton").addEventListener("click",showHome);
$("continueButton").addEventListener("click",()=>startStage(Math.min(currentStage,STAGES.length-1)));
$("progressReset").addEventListener("click",()=>{if(processing)return;dialog("進捗をリセットする？","クリア記録と進行ステージを初期化する。盤面データやゲームの設定は変更しない。","リセット",()=>{currentStage=0;clearedStages=0;try{localStorage.removeItem('pixelCollectionStage');localStorage.removeItem('pixelCollectionCleared');}catch(e){}showHome();})});
showHome()})();
</script></body></html>
